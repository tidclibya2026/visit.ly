name: Verify Visit Libya

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: TypeScript, tests, and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm check

      - name: Run Vitest
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

      - name: Store client build artifact
        uses: actions/upload-artifact@v4
        with:
          name: visit-libya-client-build
          path: dist/public
          if-no-files-found: error
          retention-days: 7
